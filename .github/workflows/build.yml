name: Build desktop apps
on:
  push:
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux-x64
          - os: macos-15
            label: macOS-Apple-Silicon
          - os: macos-15-intel
            label: macOS-Intel
          - os: windows-2022
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build portable download (Java installed separately)
        if: runner.os != 'Windows'
        run: bash scripts/package.sh
      - name: Build portable download on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify connection interface and Advanced mode
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B -Djava.awt.headless=false -Dmoondrop.test.ui=true -Dtest=AppWindowUsabilityTest,MainCachedStartupTest test
      - name: Check macOS setup Java detection
        if: runner.os == 'macOS'
        run: bash scripts/launchers/installmacos.command --check-java
      - name: Verify native engine and encrypted connection
        if: runner.os != 'Windows'
        run: |
          java "-Dshadowmere.dataDir=target/native-test-data" -jar target/moondrop.jar --install-engine
          mvn -B -Dengine.test.path="$PWD/target/native-test-data/engine/sing-box" test
      - name: Verify native Windows engine and encrypted connection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          java "-Dshadowmere.dataDir=target/native-test-data" -jar target/moondrop.jar --install-engine
          if ($LASTEXITCODE -ne 0) { throw 'Engine installation failed' }
          $engine = (Resolve-Path target/native-test-data/engine/sing-box.exe).Path
          mvn -B "-Dengine.test.path=$engine" test
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted connection test failed' }
      - name: Verify Linux strict tunnel in an isolated offline network namespace
        if: runner.os == 'Linux'
        run: |
          sudo env MOONDROP_TEST_HOST_NET="$(readlink /proc/self/ns/net)" MOONDROP_TUN_TEST_CORE="$PWD/target/native-test-data/engine/sing-box" unshare -n -- python3 scripts/test-linux-tunnel.py --namespace
      - name: Ensure WiX 3 is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' | Select-Object -First 1
          }
          if (-not $candle) { throw 'WiX 3 candle.exe was not found' }
          $candle.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows installer with Java
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify bundled Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'target/native-image/Moondrop/runtime/bin/java.exe'
          & $runtime --list-modules
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Java could not start' }
          & $runtime "-Dshadowmere.dataDir=target/bundled-runtime-check" -jar target/native-image/Moondrop/app/moondrop.jar --install-engine
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime networking check failed' }
          if (-not (Get-ChildItem dist/*.exe)) { throw 'Windows installer missing' }
          $config = Get-Content -Raw target/native-image/Moondrop/app/Moondrop.cfg
          if (-not $config.Contains('-Dmoondrop.distribution=native')) { throw 'Native installer update mode missing' }
          mvn -B '-Dtest=AppUpdaterTest,UpdateInstallerTest' "-Dupdate.test.java=$runtime" test
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime updater checks failed' }
      - name: Build Mac disk image with Java
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Verify Mac disk image and bundled runtime
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/dmg-check
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$PWD/target/dmg-check"
          trap 'hdiutil detach "$PWD/target/dmg-check"' EXIT
          runtime="$PWD/target/dmg-check/Moondrop.app/Contents/runtime/Contents/Home/bin/java"
          "$runtime" --list-modules
          "$runtime" "-Dshadowmere.dataDir=$PWD/target/bundled-runtime-check" -jar "$PWD/target/dmg-check/Moondrop.app/Contents/app/moondrop.jar" --install-engine
          grep -F -- '-Dmoondrop.distribution=native' "$PWD/target/dmg-check/Moondrop.app/Contents/app/Moondrop.cfg"
          mvn -B -Dtest=AppUpdaterTest,UpdateInstallerTest "-Dupdate.test.java=$runtime" test
      - name: Generate dependency SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputDirectory=dist -DoutputName=moondrop-sbom
      - name: Reject high-severity vulnerable dependencies
        run: python3 scripts/check-vulnerabilities.py dist/moondrop-sbom.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        if: github.event_name == 'push'
        with:
          subject-path: |
            target/moondrop.jar
            dist/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        if: github.event_name == 'push'
        with:
          subject-path: target/moondrop.jar
          sbom-path: dist/moondrop-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Moondrop-${{ matrix.label }}
          path: |
            dist/Moondrop.zip
            dist/moondrop-sbom.*
            dist/*.exe
            dist/*.dmg
            target/moondrop.jar
          if-no-files-found: error
