name: Build Android app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'src/main/java/xyz/shadowmere/desktop/Server.java', 'src/main/java/xyz/shadowmere/desktop/ProxyLinks.java']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'src/main/java/xyz/shadowmere/desktop/Server.java', 'src/main/java/xyz/shadowmere/desktop/ProxyLinks.java']
  workflow_dispatch:
    inputs:
      native_only:
        description: Build the native library without the APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5', cache: false }
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-libbox-v1.14.3-${{ hashFiles('android/native/bridge.go', 'android/native/build.sh') }}
          restore-keys: android-libbox-v1.14.3-
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: |
          sdkmanager 'ndk;28.0.13004108' 'platforms;android-26' 'platforms;android-36' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Build protected networking engine from source
        run: bash android/native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Moondrop-Android-engine
          path: android/app/libs/moondrop-engine.aar
          if-no-files-found: error
  app:
    needs: engine
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: Moondrop-Android-engine, path: android/app/libs }
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and check APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Moondrop-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: error
