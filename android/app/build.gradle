plugins { id 'com.android.application' }
android {
    namespace 'xyz.moondrop.android'
    compileSdk 36
    defaultConfig {
        applicationId 'xyz.moondrop.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets { main.java.srcDir layout.buildDirectory.dir('generated/shared/java'); main.assets.srcDir layout.buildDirectory.dir('generated/notices') }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    packaging { jniLibs { useLegacyPackaging false }; resources { excludes += ['META-INF/LICENSE*','META-INF/NOTICE*'] } }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true; animationsDisabled = true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation files('libs/moondrop-engine.aar')
    implementation 'com.google.code.gson:gson:2.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Copy only platform-independent models; Swing and desktop HTTP stay out.
def sharedModels = tasks.register('syncSharedModels', Sync) {
    from('../../src/main/java') {
        include 'xyz/shadowmere/desktop/Server.java', 'xyz/shadowmere/desktop/ProxyLinks.java', 'xyz/shadowmere/desktop/PublicEndpoints.java'
    }
    into layout.buildDirectory.dir('generated/shared/java')
}
tasks.named('preBuild').configure { dependsOn sharedModels }

def licenseNotices = tasks.register('syncLicenseNotices', Sync) {
    from('../..') { include 'LICENSE', 'THIRD_PARTY.md' }
    into layout.buildDirectory.dir('generated/notices')
}
tasks.named('preBuild').configure { dependsOn licenseNotices }
