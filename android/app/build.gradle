plugins { id 'com.android.application' }
android {
    namespace 'xyz.moondrop.android'
    compileSdk 36
    defaultConfig {
        applicationId 'xyz.moondrop.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets {
        main.java {
            srcDirs 'src/main/java', '../../src/main/java'
            include 'xyz/moondrop/android/**', 'xyz/shadowmere/desktop/Server.java', 'xyz/shadowmere/desktop/ProxyLinks.java'
        }
    }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    packaging { jniLibs { useLegacyPackaging false }; resources { excludes += ['META-INF/LICENSE*','META-INF/NOTICE*'] } }
    testOptions { unitTests.returnDefaultValues = true; animationsDisabled = true }
}
dependencies {
    implementation files('libs/moondrop-engine.aar')
    implementation 'com.google.code.gson:gson:2.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
